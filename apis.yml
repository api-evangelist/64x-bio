aid: 64x-bio
name: 64x Bio
description: '64x Bio is a bioengineering company in Brisbane, California, founded in 2018 by scientists out of
  Harvard Medical School and the Wyss Institute to rebuild the manufacturing foundation for cell and gene therapies.
  Its VectorSelect platform pairs massively parallelized, barcoded genome-scale pooled screens with computational
  mining of CellMap, a proprietary atlas linking genetic and metabolic pathway data to production phenotypes, to
  engineer high-yield producer cell lines. Commercial products are the AAV APEX Suite for adeno-associated virus
  production across serotypes and scales, the LV APEX Suite for lentiviral vectors used in CAR-T programs, and a
  Biologics Suite for antibodies and protein therapeutics still in development. The business is delivered through
  licensing and partnership agreements with therapeutics developers and manufacturers rather than as software: CellMap
  and the screening stack are internal research infrastructure, and 64x Bio publishes no developer program, public
  API, SDK or machine-readable contract of any kind.'
